name: Clean old deployment images and backups

on:
  schedule:
    - cron: '00 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-udanyrejs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Clean VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
        run: |
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          printf -v remote 'bash -s -- %q' "$VPS_PROJECT_PATH"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "$remote" < .github/scripts/deploy/cleanup.sh
