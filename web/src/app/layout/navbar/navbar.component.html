<nav class="navbar" aria-label="Nawigacja główna">
  <div class="navbar-container">
    <img src="/assets/wave-left.png" class="wave wave-left" alt="" aria-hidden="true" />
    <div class="navbar-content">
      <a
        routerLink="/offers"
        class="nav-link"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Oferty</a
      >
      <a
        routerLink="/offers/recommended"
        class="nav-link desktop-link"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >Polecamy</a
      >
      <a routerLink="/offers" class="logo-container" aria-label="UdanyRejs — strona główna">
        <img src="/assets/logo.png" class="logo" alt="UdanyRejs" />
      </a>
      <div class="nav-menu desktop-link" [class.open]="activeMenu === 'destinations'" (mouseleave)="closeMenu()">
        <div class="nav-menu-trigger">
          <button
            type="button"
            class="nav-link nav-menu-label"
            [class.active]="activeMenu === 'destinations'"
            [attr.aria-expanded]="activeMenu === 'destinations'"
            aria-controls="destinations-menu"
            (click)="toggleMenu('destinations')"
          >
            Kierunki
          </button>
          <button
            type="button"
            class="nav-menu-toggle"
            aria-label="Rozwiń kierunki"
            aria-controls="destinations-menu"
            [attr.aria-expanded]="activeMenu === 'destinations'"
            (click)="toggleMenu('destinations')"
          >
            <mat-icon>expand_more</mat-icon>
          </button>
        </div>
        <div id="destinations-menu" class="dropdown-menu">
          <span class="dropdown-title">Popularne kierunki</span>
          <a
            *ngFor="let destination of destinationMenuItems$ | async"
            [routerLink]="['/destinations', destination.slug]"
            (click)="closeMenu()"
            >{{ destination.name }}</a
          >
          <a class="show-all-menu-items" routerLink="/destinations" (click)="closeMenu()">Wszystkie kierunki</a>
        </div>
      </div>
      <div class="nav-menu" [class.open]="activeMenu === 'companies'" (mouseleave)="closeMenu()">
        <div class="nav-menu-trigger">
          <button
            type="button"
            class="nav-link nav-menu-label"
            [class.active]="activeMenu === 'companies'"
            [attr.aria-expanded]="activeMenu === 'companies'"
            aria-controls="companies-menu"
            (click)="toggleMenu('companies')"
          >
            Armatorzy
          </button>
          <button
            type="button"
            class="nav-menu-toggle"
            aria-label="Rozwiń armatorów"
            aria-controls="companies-menu"
            [attr.aria-expanded]="activeMenu === 'companies'"
            (click)="toggleMenu('companies')"
          >
            <mat-icon>expand_more</mat-icon>
          </button>
        </div>
        <div id="companies-menu" class="dropdown-menu">
          <span class="dropdown-title">Popularni armatorzy</span>
          <a
            *ngFor="let company of companyMenuItems$ | async"
            [routerLink]="['/cruise-lines', company.slug]"
            (click)="closeMenu()"
            >{{ company.name }}</a
          >
          <a class="show-all-menu-items" routerLink="/cruise-lines" (click)="closeMenu()">Wszyscy armatorzy</a>
        </div>
      </div>
    </div>
    <img src="/assets/wave-right.png" class="wave wave-right" alt="" aria-hidden="true" />
  </div>
</nav>
