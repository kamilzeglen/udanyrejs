<div *ngIf="(loading$ | async) === false">
  <app-sub-menu *ngIf="subMenuItems" [subMenuItems]="subMenuItems"></app-sub-menu>

  <div class="offers" *ngIf="offers$ | async as offers">
    <div *ngFor="let offer of offers">
      <app-offer-card [offer]="offer"></app-offer-card>
    </div>
  </div>
</div>

<app-spinner *ngIf="(loading$ | async) === true" appAutoSpinner [size]="75"></app-spinner>
