<div class="contact">
  <section class="employees">
    <h1>Skontaktuj się z naszymi pracownikami</h1>
    <div class="employee-card" *ngFor="let employee of employees">
      <img [src]="employee.photo" [alt]="employee.name" />
      <div>
        <h3>{{ employee.name }}</h3>
        <p>Telefon: {{ employee.phone }}</p>
        <p>
          Email: <a [href]="'mailto:' + employee.email">{{ employee.email }}</a>
        </p>
      </div>
    </div>
  </section>

  <section class="contact-form">
    <h1>Napisz do nas!</h1>
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Imię i nazwisko</label>
        <input id="name" formControlName="name" type="text" placeholder="Wpisz swoje imię i nazwisko" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" formControlName="email" type="email" placeholder="Wpisz swój email" />
      </div>
      <div class="form-group" *ngIf="contactForm.get('offer').value">
        <label for="offer">Oferta</label>
        <input id="offer" formControlName="offer" type="text" placeholder="" class="disabled" />
      </div>
      <div class="form-group">
        <label for="message">Wiadomość</label>
        <textarea id="message" formControlName="message" rows="5" placeholder="Napisz swoją wiadomość"></textarea>
      </div>
      <button type="submit">Wyślij</button>
    </form>
  </section>
</div>
