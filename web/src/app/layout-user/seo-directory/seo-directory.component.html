<section class="directory-page">
  <header class="directory-hero">
    <p>UdanyRejs</p>
    <h1>{{ pageTitle }}</h1>
    <span>{{ pageDescription }}</span>
  </header>

  <div class="directory-grid">
    <a
      *ngFor="let entity of entities$ | async"
      class="directory-card"
      [class.company-directory-card]="entityType === 'company'"
      [routerLink]="[basePath, entity.slug]"
    >
      <img *ngIf="entity.imageUrl" [src]="entity.imageUrl" [alt]="entity.name" />
      <div class="directory-card-placeholder" *ngIf="!entity.imageUrl" aria-hidden="true"></div>
      <div class="directory-card-content">
        <h2>{{ entity.name }}</h2>
        <div *ngIf="entity.description" [innerHTML]="entity.description"></div>
        <span>Zobacz rejsy</span>
      </div>
    </a>
  </div>
</section>
