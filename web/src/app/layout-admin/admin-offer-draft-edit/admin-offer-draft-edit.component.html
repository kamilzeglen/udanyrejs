<div class="admin-offer-draft-edit" *ngIf="draftForm">
  <h2>Import oferty ze scrapera</h2>

  <form [formGroup]="draftForm" (ngSubmit)="submitForm()">
    <div class="form-group">
      <label for="name">Nazwa</label>
      <input id="name" formControlName="name" type="text" />
    </div>

    <div class="form-group" *ngIf="companies$ | async as companies">
      <label for="companyId">Armator</label>
      <select id="companyId" formControlName="companyId">
        <option *ngFor="let company of companies" [value]="company.id">{{ company.name }}</option>
      </select>
    </div>

    <div class="form-group" *ngIf="ships$ | async as ships">
      <label for="shipId">Statek</label>
      <select id="shipId" formControlName="shipId">
        <option *ngFor="let ship of ships" [value]="ship.id">{{ ship.name }}</option>
      </select>
    </div>

    <div class="form-group" *ngIf="destinations$ | async as destinations">
      <label for="destinations">Kierunki:</label>
      <mat-select formControlName="destinations" id="destinations" placeholder="Kierunki" multiple>
        <mat-option *ngFor="let destination of destinations" [value]="destination.id">
          {{ destination.name }}
        </mat-option>
      </mat-select>
    </div>

    <div class="form-group" *ngIf="categories$ | async as categories">
      <label for="categories">Kategorie:</label>
      <mat-select formControlName="categories" id="categories" placeholder="Kategorie" multiple>
        <mat-option *ngFor="let category of categories" [value]="category.id">
          {{ category.name }}
        </mat-option>
      </mat-select>
    </div>

    <div formArrayName="terms">
      <div *ngFor="let termGroup of termsArray.controls; let termIndex = index" [formGroupName]="termIndex">
        <p>{{ termGroup.get('startDate')?.value }} - {{ termGroup.get('endDate')?.value }}</p>
        <div formArrayName="prices">
          <div
            *ngFor="let priceGroup of $any(termGroup.get('prices')).controls; let priceIndex = index"
            [formGroupName]="priceIndex"
          >
            <select formControlName="cabinTypeId">
              <option value="">(bez dopasowania - {{ priceGroup.get('cabinTypeName')?.value }})</option>
              <option *ngFor="let cabinType of cabinTypes$ | async" [value]="cabinType.id">{{ cabinType.name }}</option>
            </select>
            <input formControlName="price" type="number" step="0.01" />
          </div>
        </div>
      </div>
    </div>

    <button type="submit" [disabled]="draftForm.invalid">Zaimportuj</button>
  </form>
</div>
