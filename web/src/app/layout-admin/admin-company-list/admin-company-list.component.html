<div class="admin-companies-list">
  <div class="add-button">
    <button (click)="addCompany()">Dodaj firme</button>
  </div>

  <div class="mat-elevation-z8 custom-table">

    <table mat-table *ngIf="(loading$ | async) === false" [dataSource]="companies$" matSort>

      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let element, let i = index ">{{ i + 1 }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nazwa</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <!-- Key Column -->
      <ng-container matColumnDef="key">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Klucz</th>
        <td mat-cell *matCellDef="let element">{{ element.key }}</td>
      </ng-container>

      <!-- Image Column -->
      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Zdjęcie</th>
        <td mat-cell *matCellDef="let element">
          <mat-icon *ngIf="element.imageFileId">checked</mat-icon>
          <mat-icon *ngIf="!element.imageFileId">unchecked</mat-icon>
        </td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Opis</th>
        <td mat-cell *matCellDef="let element" [innerHTML]="element.description">{{ element.description ? '' : '-' }}</td>

      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Akcje</th>
        <td mat-cell *matCellDef="let element">
          <mat-icon class="icon-edit" (click)="editCompany(element); $event.stopPropagation()">edit</mat-icon>
          <mat-icon class="icon-delete" (click)="deleteCompany(element); $event.stopPropagation()">delete</mat-icon>
        </td>
      </ng-container>

      <!-- Updated At Column -->
      <ng-container matColumnDef="updatedAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Data aktualizacji</th>
        <td mat-cell *matCellDef="let element">{{ element.updatedAt | date: 'dd.MM.yyyy HH:mm' }}</td>
      </ng-container>

      <!-- Created At Column -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Data utworzenia</th>
        <td mat-cell *matCellDef="let element">{{ element.createdAt | date: 'dd.MM.yyyy HH:mm' }}</td>
      </ng-container>

      <!-- Header and Row -->
      <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
      <tr mat-row *matRowDef="let row; columns: columnsToDisplay;" (click)="editCompany(row)"></tr>
    </table>
  </div>
</div>
