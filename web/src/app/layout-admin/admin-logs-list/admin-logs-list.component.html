<div class="admin-categories-list">
  <div class="mat-elevation-z8 custom-table">
    <table mat-table *ngIf="(loading$ | async) === false" [dataSource]="logs" matSort>
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Nr</th>
        <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
      </ng-container>

      <!-- Message Column -->
      <ng-container matColumnDef="message">
        <th mat-header-cell *matHeaderCellDef>Wiadomość</th>
        <td mat-cell *matCellDef="let element">{{ element.message || '-' }}</td>
      </ng-container>

      <!-- Created By Column -->
      <ng-container matColumnDef="createdBy">
        <th mat-header-cell *matHeaderCellDef>Autor</th>
        <td mat-cell *matCellDef="let element">{{ element.createdBy.email || '-' }}</td>
      </ng-container>

      <!-- Created At Column -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Data utworzenia</th>
        <td mat-cell *matCellDef="let element">{{ element.createdAt | date: 'dd.MM.yyyy HH:mm' }}</td>
      </ng-container>

      <!-- Header and Row -->
      <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
      <tr mat-row *matRowDef="let row; columns: columnsToDisplay" class="row"></tr>
    </table>
  </div>
</div>
