<div class="admin-categories-list">
  <div class="add-button">
    <button (click)="addCity()">Dodaj miasto</button>
  </div>

  <div class="mat-elevation-z8 custom-table">
    <table mat-table *ngIf="(loading$ | async) === false" [dataSource]="cityRows$" matSort>
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Nr</th>
        <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nazwa</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <ng-container matColumnDef="destinationNames">
        <th mat-header-cell *matHeaderCellDef>Regiony</th>
        <td mat-cell *matCellDef="let element">{{ element.destinationNames }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Akcje</th>
        <td mat-cell *matCellDef="let element">
          <mat-icon class="icon-edit" (click)="editCity(element); $event.stopPropagation()">edit</mat-icon>
          <mat-icon class="icon-delete" (click)="deleteCity(element); $event.stopPropagation()">delete</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="updatedAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Data aktualizacji</th>
        <td mat-cell *matCellDef="let element">{{ element.updatedAt | date: 'dd.MM.yyyy HH:mm' }}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Data utworzenia</th>
        <td mat-cell *matCellDef="let element">{{ element.createdAt | date: 'dd.MM.yyyy HH:mm' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
      <tr mat-row *matRowDef="let row; columns: columnsToDisplay" class="row" (click)="editCity(row)"></tr>
    </table>
  </div>
</div>
