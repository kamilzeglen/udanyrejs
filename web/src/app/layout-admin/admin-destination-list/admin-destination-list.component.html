<div class="admin-categories-list">
  <div class="add-button">
    <button (click)="addDestination()">Dodaj region</button>
  </div>

  <div class="mat-elevation-z8 custom-table" *ngIf="(loading$ | async) === false && (viewModel$ | async) as viewModel">
    <div class="selection-toolbar" [style.visibility]="viewModel.selectedCount > 0 ? 'visible' : 'hidden'">
      <span>{{ viewModel.selectedCount }} zaznaczonych</span>
      <button type="button" (click)="selection.clear()">Odznacz wszystko</button>
    </div>

    <table mat-table [dataSource]="viewModel.rows" matSort>
      <!-- Select Column -->
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox
            [checked]="viewModel.headerChecked"
            [indeterminate]="viewModel.headerIndeterminate"
            (change)="toggleSelectAll(viewModel.rows)"
            (click)="$event.stopPropagation()"
          ></mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let element">
          <mat-checkbox
            [checked]="element.selected"
            (change)="selection.toggle(element.id)"
            (click)="$event.stopPropagation()"
          ></mat-checkbox>
        </td>
      </ng-container>

      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Nr</th>
        <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nazwa</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <!-- Offers Amount Column -->
      <ng-container matColumnDef="offerCount">
        <th mat-header-cell *matHeaderCellDef>Liczba ofert</th>
        <td mat-cell *matCellDef="let element">{{ element.offerCount || '-' }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Akcje</th>
        <td mat-cell *matCellDef="let element">
          <mat-icon class="icon-edit" (click)="editDestination(element); $event.stopPropagation()">edit</mat-icon>
          <mat-icon class="icon-delete" (click)="deleteDestination(element); $event.stopPropagation()">delete</mat-icon>
        </td>
      </ng-container>

      <!-- Updated At Column -->
      <ng-container matColumnDef="updatedAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Data aktualizacji</th>
        <td mat-cell *matCellDef="let element">{{ element.updatedAt | date: 'dd.MM.yyyy HH:mm' }}</td>
      </ng-container>

      <!-- Created At Column -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Data utworzenia</th>
        <td mat-cell *matCellDef="let element">{{ element.createdAt | date: 'dd.MM.yyyy HH:mm' }}</td>
      </ng-container>

      <!-- Header and Row -->
      <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
      <tr mat-row *matRowDef="let row; columns: columnsToDisplay" class="row" (click)="editDestination(row)"></tr>
    </table>
  </div>
</div>
