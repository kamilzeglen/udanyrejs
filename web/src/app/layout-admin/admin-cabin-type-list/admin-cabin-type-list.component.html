<div class="admin-cabin-types-list">
  <div class="add-button">
    <button (click)="addCabinType()">Dodaj rodzaj kabiny</button>
  </div>

  <ng-container *ngIf="(loading$ | async) === false">
    <div class="company-group" *ngFor="let group of cabinTypesGroups$ | async">
      <h2 class="company-group__name">{{ group.companyName }}</h2>

      <div class="mat-elevation-z8 custom-table">
        <table mat-table [dataSource]="group.cabinTypes" matSort>
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>Nr</th>
            <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nazwa</th>
            <td mat-cell *matCellDef="let element">{{ element.name }}</td>
          </ng-container>

          <ng-container matColumnDef="isActive">
            <th mat-header-cell *matHeaderCellDef>Aktywna</th>
            <td mat-cell *matCellDef="let element">
              <mat-icon *ngIf="element.isActive" style="color: green">checked</mat-icon>
              <mat-icon *ngIf="!element.isActive" style="color: red">unchecked</mat-icon>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Akcje</th>
            <td mat-cell *matCellDef="let element">
              <mat-icon class="icon-edit" (click)="editCabinType(element); $event.stopPropagation()">edit</mat-icon>
              <mat-icon
                *ngIf="element.isActive"
                class="icon-delete"
                (click)="deactivateCabinType(element); $event.stopPropagation()"
              >
                delete
              </mat-icon>
              <mat-icon
                *ngIf="!element.isActive"
                class="icon-activate"
                (click)="activateCabinType(element); $event.stopPropagation()"
              >
                check_circle
              </mat-icon>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
          <tr mat-row *matRowDef="let row; columns: columnsToDisplay" class="row" (click)="editCabinType(row)"></tr>
        </table>
      </div>
    </div>

    <div class="empty-state" *ngIf="(cabinTypesGroups$ | async)?.length === 0">
      Brak dodanych rodzajów kabin. Dodaj pierwszy przyciskiem powyżej.
    </div>
  </ng-container>
</div>
