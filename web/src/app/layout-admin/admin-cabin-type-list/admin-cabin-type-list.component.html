<div class="admin-cabin-types-list">
  <div class="add-button">
    <button (click)="addCabinType()" [disabled]="!selectedCompany">Dodaj rodzaj kabiny</button>
  </div>

  <div class="company-select">
    <div class="label">Wybierz armatora</div>
    <mat-select [(ngModel)]="selectedCompany" (ngModelChange)="changedCompany(selectedCompany)">
      <mat-option *ngFor="let company of companies$ | async" [value]="company.id">
        {{ company.name }}
      </mat-option>
    </mat-select>
  </div>

  <div
    *ngIf="(loading$ | async) === false && (cabinTypes$ | async) && selectedCompany"
    class="mat-elevation-z8 custom-table"
  >
    <table mat-table [dataSource]="cabinTypes$" matSort>
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Nr</th>
        <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nazwa</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Aktywna</th>
        <td mat-cell *matCellDef="let element">
          <mat-icon *ngIf="element.isActive" style="color: green">checked</mat-icon>
          <mat-icon *ngIf="!element.isActive" style="color: red">unchecked</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Akcje</th>
        <td mat-cell *matCellDef="let element">
          <mat-icon class="icon-edit" (click)="editCabinType(element); $event.stopPropagation()">edit</mat-icon>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
      <tr mat-row *matRowDef="let row; columns: columnsToDisplay" class="row" (click)="editCabinType(row)"></tr>
    </table>
  </div>
</div>
