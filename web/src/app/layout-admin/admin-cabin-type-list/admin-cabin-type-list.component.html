<div class="admin-cabin-types-list">
  <div class="add-button">
    <button (click)="addCabinType()">Dodaj rodzaj kabiny</button>
  </div>

  <ng-container *ngIf="(loading$ | async) === false && (viewModel$ | async) as viewModel">
    <div class="selection-toolbar" [style.visibility]="viewModel.selectedCount > 0 ? 'visible' : 'hidden'">
      <span>{{ viewModel.selectedCount }} zaznaczonych</span>
      <button type="button" (click)="selection.clear()">Odznacz wszystko</button>
    </div>

    <div class="company-group" *ngFor="let group of viewModel.groups">
      <h2 class="company-group__name">{{ group.companyName }}</h2>

      <div class="mat-elevation-z8 custom-table">
        <table mat-table [dataSource]="group.cabinTypes" matSort>
          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>
              <mat-checkbox
                [checked]="group.headerChecked"
                [indeterminate]="group.headerIndeterminate"
                (change)="toggleSelectAll(group.cabinTypes)"
                (click)="$event.stopPropagation()"
              ></mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let element">
              <mat-checkbox
                [checked]="element.selected"
                (change)="selection.toggle(element.id)"
                (click)="$event.stopPropagation()"
              ></mat-checkbox>
            </td>
          </ng-container>

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>Nr</th>
            <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nazwa</th>
            <td mat-cell *matCellDef="let element">{{ element.name }}</td>
          </ng-container>

          <ng-container matColumnDef="offersCount">
            <th mat-header-cell *matHeaderCellDef>Liczba ofert</th>
            <td mat-cell *matCellDef="let element">{{ element.offersCount ?? 0 }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Akcje</th>
            <td mat-cell *matCellDef="let element">
              <mat-icon class="icon-edit" (click)="editCabinType(element); $event.stopPropagation()">edit</mat-icon>
              <mat-icon
                class="icon-delete"
                [class.icon-disabled]="element.offersCount > 0"
                [attr.title]="
                  element.offersCount > 0 ? 'Nie można usunąć — kabina jest używana przez oferty' : 'Usuń na stałe'
                "
                (click)="deleteCabinType(element); $event.stopPropagation()"
              >
                delete
              </mat-icon>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
          <tr mat-row *matRowDef="let row; columns: columnsToDisplay" class="row" (click)="editCabinType(row)"></tr>
        </table>
      </div>
    </div>

    <div class="empty-state" *ngIf="viewModel.groups.length === 0">
      Brak dodanych rodzajów kabin. Dodaj pierwszy przyciskiem powyżej.
    </div>
  </ng-container>
</div>
