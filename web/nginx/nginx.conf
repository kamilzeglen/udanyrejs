events {}

http {
    include /etc/nginx/mime.types;
    sendfile on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    map $request_uri $robots_policy {
        default "";
        ~^/(admin|login|error|share)(/|\?|$) "noindex, nofollow";
        ~^/contact/ "noindex, nofollow";
    }

    server {
        root /usr/share/nginx/html;
        index index.html;

        location = /robots.txt {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location = /sitemap.xml {
            add_header Cache-Control "no-cache";
            proxy_pass https://udanyrejs-api.kamilzeglen.pl/sitemap.xml;
            proxy_set_header Host udanyrejs-api.kamilzeglen.pl;
        }

        location = /assets/robots.txt {
            return 301 /robots.txt;
        }

        location = /assets/sitemap.xml {
            return 301 /sitemap.xml;
        }

        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            try_files $uri =404;
        }

        location ~* "-[0-9A-Za-z]{8,20}\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location ~* \.(js|css|map|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif|xml|txt|json)$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            add_header X-Robots-Tag $robots_policy always;
            try_files $uri $uri/ /index.html;
        }
    }
}
