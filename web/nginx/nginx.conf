# the events block is required
events{}

http {
    # include the default mime.types to map file extensions to MIME types
    include /etc/nginx/mime.types;

    server {
        # set the root directory for the server (we need to copy our
        # application files here)
        root /usr/share/nginx/html;

        # set the default index file for the server (Angular generates the
        # index.html file for us and it will be in the above directory)
        index index.html;

        # hashed build output (main-XXXXXXXX.js, styles-XXXXXXXX.css, ...) never
        # changes content under the same filename, so it can be cached
        # aggressively and indefinitely by browsers/proxies
        location ~* \.[0-9a-f]{8,20}\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # index.html (and anything else not matched above, e.g. the SW
        # manifest) must always be revalidated so users get the pointer to
        # the latest hashed build
        location / {
            add_header Cache-Control "no-cache";

            # try to serve the requested URI. if that fails then try to
            # serve the URI with a trailing slash. if that fails, then
            # serve the index.html file; this is needed in order to serve
            # Angular routes--e.g.,'localhost:8080/customer' will serve
            # the index.html file
            try_files $uri $uri/ /index.html;
        }
    }
}
