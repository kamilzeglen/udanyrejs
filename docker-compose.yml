services:
    udanyrejs-frontend:
        build:
            context: ./web
            dockerfile: Dockerfile
        container_name: udanyrejs-frontend
        restart: always
        ports:
            - "3006:80"
        networks:
            - nginx-proxy-manager_default
            - udanyrejs_default

    udanyrejs-backend:
        build:
            context: ./api
            dockerfile: Dockerfile
        container_name: udanyrejs-backend
        env_file:
            - api/.env
        restart: always
        ports:
            - "5006:5006"
        volumes:
            - /root/Projects/udanyrejs/files/OFFERS_IMAGES:/app/files/OFFERS_IMAGES
            - /root/Projects/udanyrejs/files/SHIPS_IMAGES:/app/files/SHIPS_IMAGES
            - /root/Projects/udanyrejs/files/COMPANIES_IMAGES:/app/files/COMPANIES_IMAGES
            - /root/Projects/udanyrejs/files/OFFERS_PDFS:/app/files/OFFERS_PDFS
        networks:
            - nginx-proxy-manager_default
            - postgres_default
            - udanyrejs_default

    udanyrejs-scrapper:
        build:
            context: ./scrapper
            dockerfile: Dockerfile
        container_name: udanyrejs-scrapper
        env_file:
            - scrapper/.env
        restart: always
        ports:
            - "4006:4006"
        networks:
            - nginx-proxy-manager_default
            - udanyrejs_default

networks:
    nginx-proxy-manager_default:
        external: true
    postgres_default:
        external: true
    udanyrejs_default:
        external: true
